<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>DINAMITA.EXE - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');

        #app {
            font-family: 'Inter', sans-serif;
            background: #F8F7F4;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 220px;
            background: #FFFFFF;
            border-right: 0.5px solid #E2E0D9;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .logo-area {
            padding: 0 16px 20px;
            border-bottom: 0.5px solid #E2E0D9;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: #E24B4A;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .logo-title {
            font-size: 13px;
            font-weight: 700;
            color: #2C2C2A;
            letter-spacing: -0.3px;
        }

        .logo-sub {
            font-size: 9px;
            font-weight: 500;
            color: #888780;
            letter-spacing: 0.15em;
            font-family: 'JetBrains Mono', monospace;
        }

        nav {
            padding: 0 10px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
            color: #888780;
            cursor: pointer;
            margin-bottom: 2px;
            transition: all 0.15s;
        }

        .nav-item.active {
            background: #FCEBEB;
            color: #A32D2D;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #FFFFFF;
            border-bottom: 0.5px solid #E2E0D9;
            padding: 16px 20px;
        }

        .search-bar-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
        }

        .filters-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-wrap {
            flex: 1;
            position: relative;
        }

        .search-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #B4B2A9;
        }

        input,
        select {
            background: #F8F7F4;
            border: 0.5px solid #D3D1C7;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: #444441;
            outline: none;
        }

        #searchInput {
            width: 100%;
            padding-left: 34px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-group label {
            font-size: 9px;
            font-weight: 700;
            color: #888780;
            text-transform: uppercase;
        }

        .btn-search {
            background: #E24B4A;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-search:hover {
            background: #A32D2D;
        }

        .dashboard-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 20px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .kpi-card {
            background: #FFFFFF;
            border: 0.5px solid #E2E0D9;
            border-radius: 10px;
            padding: 14px 16px;
        }

        .kpi-label {
            font-size: 9px;
            font-weight: 600;
            color: #888780;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .kpi-value {
            font-size: 18px;
            font-weight: 700;
            color: #2C2C2A;
            font-family: 'JetBrains Mono', monospace;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .chart-card {
            background: #FFFFFF;
            border: 0.5px solid #E2E0D9;
            border-radius: 10px;
            padding: 16px;
        }

        .table-card {
            background: #FFFFFF;
            border: 0.5px solid #E2E0D9;
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            font-size: 9px;
            font-weight: 700;
            color: #B4B2A9;
            text-transform: uppercase;
            padding: 10px 16px;
            text-align: left;
            border-bottom: 0.5px solid #E2E0D9;
        }

        tbody td {
            padding: 10px 16px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
        }

        .badge-activo {
            background: #EAF3DE;
            color: #3B6D11;
        }

        .badge-proceso {
            background: #FAEEDA;
            color: #854F0B;
        }
    </style>
</head>

<body>
    <div id="app">
        <aside>
            <div class="logo-area">
                <div class="logo-icon"><i class="ti ti-radiation" style="color:#fff;font-size:16px;"></i></div>
                <div class="logo-title">DINAMITA<span style="color:#E24B4A;">.EXE</span></div>
                <div class="logo-sub">CONTRACT INTEL</div>
            </div>
            <nav>
                <div class="nav-item active"><i class="ti ti-layout-dashboard"></i> Central CMD</div>
                <div class="nav-item"><i class="ti ti-database"></i> Explorador</div>
                <div class="nav-item"><i class="ti ti-settings"></i> API Config</div>
            </nav>
        </aside>
        <main>
            <header>
                <div class="search-bar-row">
                    <div class="search-wrap">
                        <i class="ti ti-terminal"></i>
                        <input id="searchInput" type="text" placeholder="Buscar por entidad o ciudad..."
                            onkeyup="if(event.key === 'Enter') fetchData()" />
                    </div>
                    <button class="btn-search" onclick="fetchData()">EJECUTAR CONSULTA</button>
                </div>
                <div class="filters-row">
                    <div class="filter-group">
                        <label>Estado:</label>
                        <select id="filterEstado">
                            <option value="">TODOS</option>
                            <option value="En ejecución">En ejecución</option>
                            <option value="Terminado">Terminado</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Mínimo ($):</label>
                        <input type="number" id="filterMonto" placeholder="0" style="width: 100px;">
                    </div>
                    <div class="filter-group" style="margin-left: auto;">
                        <label>Ordenar:</label>
                        <select id="sortField">
                            <option value="valor_del_contrato">Valor</option>
                            <option value="nombre_entidad">Entidad</option>
                        </select>
                        <select id="sortDir">
                            <option value="DESC">DESC</option>
                            <option value="ASC">ASC</option>
                        </select>
                    </div>
                </div>
            </header>
            <div class="dashboard-scroll">
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-label">Volumen Filtrado</div>
                        <div class="kpi-value" id="m-total">$0</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Registros (Max 100)</div>
                        <div class="kpi-value" id="m-count">0</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Promedio</div>
                        <div class="kpi-value" id="m-avg">$0</div>
                    </div>
                    <div class="kpi-card" style="border-left: 4px solid #E24B4A;">
                        <div class="kpi-label">Estado API</div>
                        <div id="api-status" class="kpi-value" style="color: #639922; font-size: 14px;">CONECTADO</div>
                    </div>
                </div>
                <div class="charts-grid">
                    <div class="chart-card"><canvas id="topChart" height="100"></canvas></div>
                    <div class="chart-card"><canvas id="geoChart"></canvas></div>
                </div>
                <div class="table-card">
                    <table>
                        <thead>
                            <tr>
                                <th>Entidad</th>
                                <th>Ubicación</th>
                                <th>Valor (COP)</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        const API_BASE = "/api/contratos";
        let charts = {};

        async function fetchData() {
            try {
                // Llamada simple con el límite de 100 por defecto
                const response = await fetch(`${API_BASE}?$limit=100`);

                if (!response.ok) throw new Error("Error en la respuesta");

                const data = await response.json();

                // Actualizar el dashboard con los datos obtenidos
                updateDashboard(data);

                // Actualizar estado visual
                document.getElementById('api-status').innerText = 'CONECTADO';
                document.getElementById('api-status').style.color = '#639922';
            } catch (err) {
                console.error("Error al obtener contratos:", err);
                document.getElementById('api-status').innerText = 'ERROR';
                document.getElementById('api-status').style.color = '#E24B4A';
            }
        }


        function updateDashboard(data) {
            const total = data.reduce((a, v) => a + (Number(v.valor_del_contrato) || 0), 0);
            const count = data.length;
            document.getElementById('m-total').innerText = fmtShort(total);
            document.getElementById('m-count').innerText = count;
            document.getElementById('m-avg').innerText = fmtShort(count > 0 ? total / count : 0);
            renderTable(data);
            renderCharts(data);
        }

        function renderTable(data) {
            document.getElementById('tableBody').innerHTML = data.map(d => `
        <tr>
          <td style="font-weight:600;">${d.nombre_entidad || 'N/A'}</td>
          <td>${d.ciudad || ''} (${d.departamento || ''})</td>
          <td style="font-weight:700;">${fmt(d.valor_del_contrato || 0)}</td>
          <td><span class="badge ${String(d.estado_contrato).includes('ejecución') ? 'badge-activo' : 'badge-proceso'}">${d.estado_contrato}</span></td>
        </tr>`).join('');
        }

        function renderCharts(data) {
            if (charts.bar) charts.bar.destroy();
            if (charts.pie) charts.pie.destroy();
            const top5 = [...data].sort((a, b) => b.valor_del_contrato - a.valor_del_contrato).slice(0, 5);
            charts.bar = new Chart(document.getElementById('topChart'), {
                type: 'bar',
                data: {
                    labels: top5.map(d => d.nombre_entidad.substring(0, 10) + '...'),
                    datasets: [{ label: 'Valor', data: top5.map(d => d.valor_del_contrato), backgroundColor: '#E24B4A' }]
                },
                options: { plugins: { legend: { display: false } } }
            });
            const deptoMap = {};
            data.forEach(d => deptoMap[d.departamento] = (deptoMap[d.departamento] || 0) + 1);
            charts.pie = new Chart(document.getElementById('geoChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(deptoMap),
                    datasets: [{ data: Object.values(deptoMap), backgroundColor: ['#E24B4A', '#F09595', '#BA7517', '#639922', '#378ADD'] }]
                }
            });
        }

        function fmt(v) { return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(v); }
        function fmtShort(v) {
            if (v >= 1e9) return '$' + (v / 1e9).toFixed(1) + 'B';
            if (v >= 1e6) return '$' + (v / 1e6).toFixed(0) + 'M';
            return '$' + v.toLocaleString();
        }
        fetchData();
    </script>
</body>

</html>
